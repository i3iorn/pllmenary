[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pllmenary"
version = "0.0.1"
description = "A panel of LLMs that keep working on a question until they reach consensus."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pllmenary"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
